<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>参考文本已保存</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: transparent;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
        font:
          600 13px/1 'Segoe UI Variable',
          'Segoe UI',
          system-ui,
          sans-serif;
      }
      .toast {
        display: grid;
        width: calc(100% - 8px);
        height: calc(100% - 8px);
        place-items: center;
        border: 1px solid #d8e3d7;
        border-radius: 8px;
        color: #425747;
        background: rgba(251, 252, 249, 0.98);
        box-shadow: 0 5px 18px rgba(47, 65, 52, 0.16);
        animation: toast 2.55s ease both;
      }
      @keyframes toast {
        0% {
          opacity: 0;
          transform: translateY(5px);
        }
        6% {
          opacity: 1;
          transform: translateY(0);
        }
        84% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="toast">参考文本已保存 ✓</div>
  </body>
</html>
